services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zimshop}
      POSTGRES_USER: ${POSTGRES_USER:-zimshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a URL-safe random POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - zimshop-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zimshop} -d ${POSTGRES_DB:-zimshop}"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-zimshop}:${POSTGRES_PASSWORD:?Set a URL-safe random POSTGRES_PASSWORD in .env}@database:5432/${POSTGRES_DB:-zimshop}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_MODEL: ${CLOUDFLARE_MODEL:-@cf/meta/llama-3.1-8b-instruct}
      PAYNOW_INTEGRATION_ID: ${PAYNOW_INTEGRATION_ID:-}
      PAYNOW_INTEGRATION_KEY: ${PAYNOW_INTEGRATION_KEY:-}
      PAYNOW_RETURN_URL: ${PAYNOW_RETURN_URL:-}
      PAYNOW_RESULT_URL: ${PAYNOW_RESULT_URL:-}
      SUBSCRIPTIONS_ENABLED: ${SUBSCRIPTIONS_ENABLED:-false}
      SUBSCRIPTIONS_ADMIN_TOKEN: ${SUBSCRIPTIONS_ADMIN_TOKEN:-}
      SMSGATE_MODE: ${SMSGATE_MODE:-cloud}
      SMSGATE_API_URL: ${SMSGATE_API_URL:-}
      SMSGATE_USERNAME: ${SMSGATE_USERNAME:-}
      SMSGATE_PASSWORD: ${SMSGATE_PASSWORD:-}
      SMS_SENDING_ENABLED: ${SMS_SENDING_ENABLED:-false}
      SMSGATE_WEBHOOK_TOKEN: ${SMSGATE_WEBHOOK_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4176,http://localhost:5173}
      UPLOAD_DIR: /service/backend/uploads
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - zimshop-uploads:/service/backend/uploads
    depends_on:
      database:
        condition: service_healthy

volumes:
  zimshop-postgres:
  zimshop-uploads: